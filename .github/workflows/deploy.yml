name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Kept in step with the test workflow; the scripts need 22+ for the
          # native type stripping that lets them import the app's mappers.
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compute base URL
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
      - name: Generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.base.outputs.base }}
          # Inlined into the client bundle by design — must be a data-only,
          # single-base PAT. See AIRTABLE.md.
          NUXT_PUBLIC_AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          NUXT_PUBLIC_AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: pnpm generate
      - name: Add SPA fallback
        run: cp .output/public/index.html .output/public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
