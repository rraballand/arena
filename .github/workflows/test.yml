name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # 22+ for the native type stripping the scripts rely on to import
          # composables/airtableMappers.ts instead of duplicating it.
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        # No Airtable credentials on purpose: the suite runs against the
        # localStorage fallback, so it is deterministic and cannot touch a real
        # base. See playwright.config.ts.
        run: pnpm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
